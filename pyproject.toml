[project]
name = "mth110"
requires-python = ">= 3.13"
authors = [{ name = "Kỳ", email = "40734986+itskyf@users.noreply.github.com" }]
dependencies = ["captum>=0.9.0,<0.10", "matplotlib>=3.11,<4", "nnsight>=0.7.0,<0.8", "transformers[torch]>=5.17.0,<6"]
dynamic = ["version"]

[dependency-groups]
dev = ["google-colab-cli>=0.7.2,<0.8", "ipykernel>=7.3.0,<8", "pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2"]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pixi.feature.dev.pypi-options.dependency-overrides]
# Colab CLI 0.7.2 needs Google's JKC fork; remove when a released CLI resolves a compatible JKC without this override.
jupyter-kernel-client = { git = "https://github.com/googlecolab/jupyter-kernel-client.git", rev = "f18e982c3265df5e923aa9def101ab3fd737e139" }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
mth110 = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
cxx-compiler = ">=2.0.0,<3"
python = ">=3.13,<3.14"
