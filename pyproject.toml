[project]
name = "mth110"
requires-python = ">= 3.13"
authors = [{ name = "Kỳ", email = "40734986+itskyf@users.noreply.github.com" }]
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = ["ipykernel>=7.3.0,<8", "pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2"]

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
mth110 = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
cxx-compiler = ">=2.0.0,<3"
